<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual Car Simulator</title>
<style>
:root{--bg:#14181b;--pn:#1d2226;--ln:#3a444a;--tx:#e8eef0;--gr:#38e05a;--rd:#ff4d4d;--am:#ffb02e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:600 12px/1.25 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center}
#top button{background:#1d2226cc;border:1.5px solid var(--ln);border-radius:10px;padding:9px 11px}
#top .sp{flex:1}
#top button.on{border-color:var(--am);color:var(--am)}
#msg{position:absolute;left:8px;right:8px;top:54px;text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
#msg.bad{color:#ff8a8a}
#help{position:absolute;left:8px;right:8px;bottom:4px;text-align:center;font-size:10px;opacity:.75;text-shadow:0 1px 2px #000}
#panel{background:var(--pn);border-top:2px solid var(--ln);padding:10px 12px 12px;display:grid;gap:8px}
.r1{display:grid;grid-template-columns:1fr 1fr 1.7fr 1.2fr;gap:8px;align-items:center}
.steer{height:54px;border:2px solid var(--ln);border-radius:12px;background:#161a1d;color:var(--gr);font-size:30px;line-height:1}
.steer.on{background:#22402b}
#dial{width:100%;aspect-ratio:1;max-height:130px}
#ign{display:flex;flex-direction:column;align-items:center;gap:5px}
#key{width:50px;height:50px;border-radius:50%;background:#101316;border:2px solid var(--ln);position:relative;cursor:pointer;transition:transform .15s}
#key i{position:absolute;left:50%;top:6px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:#e8eef0}
#ign.on #key{transform:rotate(90deg);border-color:var(--gr)}
#st{border:2px solid var(--ln);border-radius:8px;padding:5px 12px;background:#161a1d}
#st.on{background:#4a3a12;border-color:var(--am)}
.r2{display:grid;grid-template-columns:1fr 1.9fr 1fr 1fr;gap:8px;height:158px}
.ped{position:relative;border:2px solid var(--ln);border-radius:12px;background:#161a1d;overflow:hidden;touch-action:none}
.ped .f{position:absolute;left:0;right:0;bottom:0;height:0;background:#8ea0aa55}
.ped.b{border-color:#7a3030}.ped.b .f{background:#ff4d4d55}
.ped.g{border-color:#2f7a40}.ped.g .f{background:#38e05a55}
.ped b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.12em;font-size:12px;pointer-events:none}
#shift{position:relative;border:2px solid var(--ln);border-radius:12px;background:#161a1d}
#shift svg{position:absolute;inset:0;width:100%;height:100%}
#shift button{position:absolute;width:30%;height:30%;transform:translate(-50%,-50%);background:none;border:0;padding:0}
#shift .lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;opacity:.8;pointer-events:none}
#knob{position:absolute;width:24px;height:24px;border-radius:50%;background:#101316;border:3px solid var(--gr);transform:translate(-50%,-50%);transition:left .14s,top .14s;pointer-events:none}
@media (prefers-reduced-motion:reduce){#knob,#key{transition:none}}
#panel{background:linear-gradient(180deg,#252d35,#171c21)}
#top button{color:#fff;font-weight:700;text-shadow:0 1px 2px #0008;box-shadow:0 3px 8px #0006}
#top button.on{box-shadow:0 0 0 2px #fff,0 0 14px #fff8;filter:brightness(1.2)}
#bReset{background:linear-gradient(135deg,#e5484d,#a31d2b)!important;border-color:#ff8a8a!important}
#bHand{background:linear-gradient(135deg,#ff9f1c,#d9480f)!important;border-color:#ffd08a!important}
#bSlope{background:linear-gradient(135deg,#a855f7,#6d28d9)!important;border-color:#d8b4fe!important}
#bView{background:linear-gradient(135deg,#38bdf8,#2563eb)!important;border-color:#bae6fd!important}
#bSnd{background:linear-gradient(135deg,#34d399,#059669)!important;border-color:#a7f3d0!important}
.steer{background:linear-gradient(180deg,#1f6b3a,#0f3a20)!important;color:#eaffef!important;border-color:#38e05a!important}
.steer.on{background:linear-gradient(180deg,#38e05a,#1a8f3a)!important;color:#04210e!important}
#st{background:linear-gradient(180deg,#ffb02e,#d97706);color:#2a1700;border-color:#ffd37a}
#st.on{background:linear-gradient(180deg,#fff27a,#ffb02e);box-shadow:0 0 14px #ffb02e}
#pc{border-color:#4aa3ff}#pc .f{background:linear-gradient(0deg,#2563ebcc,#38bdf8aa)}
.ped.b .f{background:linear-gradient(0deg,#c81e2bcc,#ff6b6baa)}.ped.g .f{background:linear-gradient(0deg,#16a34acc,#7cff9aaa)}
#shift{background:linear-gradient(160deg,#1b2430,#141a22);border-color:#6b7cff}
#knob{border-color:#7cff9a;background:radial-gradient(circle at 35% 30%,#7cff9a,#16a34a);box-shadow:0 0 10px #38e05a}
#toasts{position:absolute;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#101316ee;border:1.5px solid #38e05a;padding:7px 14px;border-radius:20px;font-size:13px;animation:tin .2s}
.toast.bad{border-color:#ff4d4d;color:#ffb0b0}.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#top button{padding:8px 7px;font-size:11px}
#bCruise{background:linear-gradient(135deg,#facc15,#ca8a04)!important;border-color:#fde68a!important;color:#1f1500!important;text-shadow:none!important}
#top{z-index:6}
#garage{position:absolute;inset:0;background:#0b0f13f5;display:none;flex-direction:column;gap:10px;padding:58px 10px 10px;overflow:auto;z-index:5;touch-action:pan-y}
#garage.open{display:flex}
.vc{border:2px solid var(--c);border-radius:14px;padding:11px 13px;text-align:left;display:grid;gap:4px;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--c),#10151a 80%)}
.vc b{font-size:17px}.vc.sel{box-shadow:0 0 0 3px #fff}
#app{position:relative}#panel{position:absolute;left:0;right:0;bottom:0;border:0;background:linear-gradient(180deg,#0000,#0008 45%);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ped,#shift{background:#ffffff14!important;backdrop-filter:blur(3px)}.ped b,#shift .lb{text-shadow:0 1px 3px #000}
#help{display:none}.steer{display:none!important}.r1{justify-content:center;grid-template-columns:minmax(0,150px) minmax(0,110px);gap:30px}
#key{background:#10131699}#cv{cursor:grab}#bFile{background:linear-gradient(135deg,#f472b6,#be185d)!important;border-color:#fbcfe8!important}
</style></head><body>
<div id="app">
<div id="view"><canvas id="cv"></canvas>
<div id="top"><button id="bReset">↺ Reset</button><span class="sp"></span><button id="bHand">Handbrake</button><button id="bSlope">Slope 0%</button><button id="bCruise">Cruise</button><button id="bView">View</button><button id="bSnd" class="on">Sound</button></div>
<div id="toasts"></div><div id="msg"></div>
<div id="help">Keys: I key · hold E start · Shift/Z clutch · W/↑ gas · S/↓ brake · A D steer · 1–6 R N gears · Space handbrake. On screen: slide up inside a pedal to press harder.</div>
</div>
<div id="panel">
<div class="r1"><button id="sL" class="steer">‹</button><button id="sR" class="steer">›</button><canvas id="dial" width="260" height="260"></canvas>
<div id="ign"><div id="key"><i></i></div><div id="st">Start</div><span id="ignl">OFF</span></div></div>
<div class="r2"><div class="ped" id="pc"><div class="f"></div><b>Clutch</b></div><div id="shift"></div><div class="ped b" id="pb"><div class="f"></div><b>Brake</b></div><div class="ped g" id="pg"><div class="f"></div><b>Accelerator</b></div></div>
</div></div>

<script>
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const cv=$('#cv'),cx=null;let W,H,renderer,cam;
function size(){const r=$('#view').getBoundingClientRect();W=Math.max(200,r.width|0);H=Math.max(200,r.height|0);if(renderer){renderer.setSize(W,H,false);cam.aspect=W/H;cam.setViewOffset(W,H,0,Math.round(H*.15),W,H);cam.updateProjectionMatrix()}}
addEventListener('resize',size);size();
let R=.31,M=1250,IE=.25,FD=3.7,RAT={R:-3.4,N:0,1:3.6,2:2.1,3:1.45,4:1.1,5:.88,6:.72};
let v,we,pos,px,steer,gear,ign,starter,running,crank,hand,slope=0,sound=true,msgT=0,L=0,Rr=0,stBtn=0,stKey=0,overT=0;
const P={c:{v:0,t:0,d:0,k:0,u:3.5,n:1.8},g:{v:0,t:0,d:0,k:0,u:2.2,n:4},b:{v:0,t:0,d:0,k:0,u:4,n:6}};
function reset(){v=0;we=0;pos=0;px=.67;laneT=.67;steer=0;gear='N';ign=false;starter=false;running=false;crank=0;hand=false;for(const k in P){P[k].v=0}knob()}
const SL={R:[14,18],1:[38,18],2:[38,82],3:[62,18],4:[62,82],5:[86,18],6:[86,82],N:[50,50]};
const sh=$('#shift');let h='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M14 18V50M38 18V82M62 18V82M86 18V82M14 50H86" stroke="#3a444a" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';
for(const k in SL){const[x,y]=SL[k];h+=`<button data-g="${k}" style="left:${x}%;top:${y}%"></button>`;if(k!=='N')h+=`<span class="lb" style="left:${x}%;top:${y<50?5:95}%">${k}</span>`}
sh.innerHTML=h+'<div id="knob"></div>';
function knob(){const[x,y]=SL[gear];const e=$('#knob');e.style.left=x+'%';e.style.top=y+'%'}
{const kn=$('#knob');let dr=0,id=-1,sx=0,sy=0,mv=0;
const pt=e=>{const r=sh.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
const gate=([x,y])=>{let b,bd=1e9;const cs=[[clamp(x,14,86),50]];for(const c of[14,38,62,86])cs.push([c,clamp(y,18,c===14?50:82)]);for(const c of cs){const d=(c[0]-x)**2+(c[1]-y)**2;if(d<bd){bd=d;b=c}}return b};
const nearest=p=>{let b='N',bd=1e9;for(const k in SL){const d=(SL[k][0]-p[0])**2+(SL[k][1]-p[1])**2;if(d<bd){bd=d;b=k}}return b};
sh.addEventListener('pointerdown',e=>{audio();dr=1;id=e.pointerId;sx=e.clientX;sy=e.clientY;mv=0;e.preventDefault()});
addEventListener('pointermove',e=>{if(!dr||e.pointerId!==id)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)mv=1;if(mv){const g=gate(pt(e));kn.style.transition='none';kn.style.left=g[0]+'%';kn.style.top=g[1]+'%'}});
addEventListener('pointerup',e=>{if(!dr||e.pointerId!==id)return;dr=0;kn.style.transition='';const p=pt(e),q=mv?gate(p):p,k=nearest(q);if((SL[k][0]-q[0])**2+(SL[k][1]-q[1])**2>V.gate)say('Missed the gate - aim for the slot',1);else shift(k==='R'||k==='N'?k:+k);knob()});
addEventListener('pointercancel',()=>{dr=0;kn.style.transition='';knob()})}
function say(t,bad){$('#msg').textContent=t;$('#msg').className=bad?'bad':'';msgT=performance.now()+2600}
function shift(g){if(g===gear)return;const mv=Math.abs(v)>.8;
if(P.c.v<.6&&(running||mv||starter)){say('Gear grind! Press the clutch all the way in first.',1);return}
if(g==='R'&&v>.8){say('Stop before selecting reverse.',1);return}
gear=g;knob()}
function pedal(el,k){const p=P[k];const set=e=>{const r=el.getBoundingClientRect();p.t=clamp(p.i+(p.y0-e.clientY)/(r.height*.7),0,1)};
el.addEventListener('pointerdown',e=>{p.d=1;p.id=e.pointerId;p.y0=e.clientY;p.i=k==='g'?.5:1;set(e);audio();e.preventDefault()});
addEventListener('pointermove',e=>{if(p.d&&e.pointerId===p.id)set(e)});
const up=e=>{if(e.pointerId===p.id)p.d=0};addEventListener('pointerup',up);addEventListener('pointercancel',up)}
pedal($('#pc'),'c');pedal($('#pb'),'b');pedal($('#pg'),'g');
function hold(el,on,off){el.addEventListener('pointerdown',e=>{audio();on();e.preventDefault()});['pointerup','pointercancel'].forEach(t=>addEventListener(t,off))}
hold($('#sL'),()=>L=1,()=>L=0);hold($('#sR'),()=>Rr=1,()=>Rr=0);
hold($('#st'),()=>{if(!ign)say('Turn the key ON first.',1);stBtn=1},()=>stBtn=0);
$('#key').onclick=()=>{audio();toggleIgn()};
function toggleIgn(){ign=!ign;if(!ign&&running){running=false;say('Engine off.')}}
$('#bHand').onclick=()=>togHand();
$('#bSlope').onclick=()=>{slope=slope===0?.06:slope===.06?.1:0;$('#bSlope').textContent='Slope '+Math.round(slope*100)+'%';$('#bSlope').classList.toggle('on',slope>0);regrade()};
$('#bSnd').onclick=()=>{sound=!sound;$('#bSnd').classList.toggle('on',sound)};
$('#bReset').onclick=()=>restart();
const keys={};
addEventListener('keydown',e=>{audio();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
if(e.repeat)return;keys[e.code]=1;
if(e.code==='KeyI'){toggleIgn()}
if(e.code==='KeyE'){if(!ign)say('Turn the key ON first (I).',1)}
if(e.code==='Space')togHand();if(e.code==='KeyC')togCruise();if(e.code==='KeyA'||e.code==='ArrowLeft')lane(-1);if(e.code==='KeyD'||e.code==='ArrowRight')lane(1);if(e.code==='Equal'||e.code==='NumpadAdd')cAdj(1);if(e.code==='Minus'||e.code==='NumpadSubtract')cAdj(-1);
const m=e.code.match(/^Digit(\d)$/);if(m){const n=+m[1];if(n>=1&&n<=6)shift(n);if(n===0)shift('N')}
if(e.code==='KeyR')shift('R');if(e.code==='KeyN')shift('N')});
addEventListener('keyup',e=>{keys[e.code]=0});
const kd=(...c)=>c.some(x=>keys[x]);
let AC,osc,o2,gn,fl;
function audio(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||webkitAudioContext)();osc=AC.createOscillator();osc.type='sawtooth';o2=AC.createOscillator();o2.type='square';fl=AC.createBiquadFilter();fl.type='lowpass';gn=AC.createGain();gn.gain.value=0;osc.connect(fl);o2.connect(fl);fl.connect(gn);gn.connect(AC.destination);osc.start();o2.start()}catch(e){AC=null}}
function snd(){if(!AC)return;const rpm=we*9.549,on=sound&&(running||starter&&ign),f=clamp(rpm/30,12,320),t=AC.currentTime;
osc.frequency.setTargetAtTime(f,t,.03);o2.frequency.setTargetAtTime(f/2,t,.03);fl.frequency.setTargetAtTime(250+rpm*.35+P.g.v*500,t,.05);
gn.gain.setTargetAtTime(on?.04+.07*P.g.v+(rpm>5500?.03:0):0,t,.05)}
const curveAt=s=>Math.min(1,s/300)*(3.2e-4*Math.sin(s/420)+1.6e-4*Math.sin(s/170+1));
function phys(dt){
const G=RAT[gear]*FD,cp=P.c.v,s=clamp((V.b1-cp)/V.bw,0,1),e=s*s*(3-2*s);
const ww=v/R*G;let Tc=0;if(G&&e>0)Tc=clamp(e*20*(we-ww),-V.cap*e*e,V.cap*e*e);
const rpm=we*9.549,th=P.g.v;let Te;
if(running)Te=th*Math.max(40,V.tq*(1-((rpm-V.pk)/V.pk)**2))*(rpm>V.red?0:1)+(1-th)*clamp((V.idle-rpm)*.3,0,80)-(10+.012*rpm)*(1-th*.9);
else Te=-(25+.04*rpm);
if(running&&G&&e>.02&&e<.9)Te+=clamp((1050-rpm)*.5,0,110);

function cmDec(d,q){const u8=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const p=new Int16Array(u8(d.p)),n=new Int8Array(u8(d.nr)),ix=new Uint16Array(u8(d.i)),pf=new Float32Array(p.length),nf=new Float32Array(n.length);
for(let i=0;i<p.length;i++){pf[i]=p[i]/q;nf[i]=n[i]/127}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pf,3));g.setAttribute('normal',new THREE.BufferAttribute(nf,3));g.setIndex(new THREE.BufferAttribute(ix,1));g.computeBoundingSphere();return g}
function cmLoad(){const q=CARMODEL.q,o={parts:{},wheels:[]};for(const k in CARMODEL.parts)o.parts[k]=cmDec(CARMODEL.parts[k],q);
for(const w of CARMODEL.wheels)o.wheels.push({c:w.c,tire:cmDec(w.tire,q),rim:cmDec(w.rim,q)});return o}
function buildCar(){try{buildCarM()}catch(e){console.error('Model load failed, fallback',e);FLM=[];if(carG)sc3.remove(carG);fw.length=0;wh.length=0;buildCarOld()}}
function buildCarM(){if(!CMG)CMG=cmLoad();carG=new THREE.Group();carG.rotation.order='YXZ';
const s=V.R/WR,DS=THREE.DoubleSide;
const paint=new THREE.MeshPhysicalMaterial({color:V.col,metalness:.6,roughness:.26,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.15,side:DS}),
trim=new THREE.MeshStandardMaterial({color:0x0d0f11,metalness:.25,roughness:.55,side:DS}),
glass=new THREE.MeshStandardMaterial({color:0x0a121a,metalness:.92,roughness:.05,envMapIntensity:1.4,side:DS}),
chrome=new THREE.MeshStandardMaterial({color:0xcfd5da,metalness:1,roughness:.18,side:DS}),
head=new THREE.MeshBasicMaterial({color:0xfff6d0,side:DS}),
tire=new THREE.MeshStandardMaterial({color:0x121416,metalness:0,roughness:.92,side:DS}),
rim=new THREE.MeshStandardMaterial({color:0xdfe5ea,metalness:.95,roughness:.2,side:DS});
tailM=new THREE.MeshBasicMaterial({color:0x7a0c0c,side:DS});
const mg=new THREE.Group();mg.scale.setScalar(s);carG.add(mg);
const mat={paint,trim,glass,chrome,head,tail:tailM};
for(const k in CMG.parts)mg.add(new THREE.Mesh(CMG.parts[k],mat[k]));
const pick=(left,front)=>CMG.wheels.find(w=>(w.c[0]<0)===left&&(w.c[2]<0)===front);
[[true,true],[false,true],[true,false],[false,false]].forEach(([l,f],i)=>{const w=pick(l,f),p=new THREE.Group(),sp=new THREE.Group();
p.position.set(w.c[0]*s,w.c[1]*s,w.c[2]*s);sp.scale.setScalar(s);sp.add(new THREE.Mesh(w.tire,tire),new THREE.Mesh(w.rim,rim));p.add(sp);carG.add(p);wh.push(sp);if(i<2)fw.push(p)});
const c=document.createElement('canvas');c.width=128;c.height=32;const g=c.getContext('2d');g.fillStyle='#eee';g.fillRect(0,0,128,32);g.fillStyle='#222';g.font='bold 20px sans-serif';g.textAlign='center';g.fillText('SM-200-20',64,23);
const pl=new THREE.Mesh(new THREE.PlaneGeometry(.5,.125),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));pl.position.set(0,1.75*s,8.87*s+.012);carG.add(pl);
PIPE=[];for(const sd of[-1,1])PIPE.push(new THREE.Vector3(sd*1.5*s,1.15*s,8.9*s));
carG.traverse(o=>{if(o.isMesh)o.castShadow=true});buildFlames(s);sc3.add(carG)}
/* ===== hết ===== */

function shift(g){if(g===gear)return;const mv=Math.abs(v)>1.5;
if(P.c.v<V.clu&&(running||mv||starter)){say('Gear Grind - Press Clutch to Shift',1);sfx('grind');return}
if(g==='R'&&v>.8){say('Stop before selecting Reverse',1);sfx('grind');return}
if(mv&&running&&typeof g==='number'){const need=Math.abs(v)/R*RAT[g]*FD*9.549;if(Math.abs(we*9.549-need)>V.sync){say('Gear Grind - match revs (~'+Math.round(need/50)*50+' rpm for gear '+g+')',1);sfx('grind');return}}
gear=g;knob();sfx('click')}
function restart(){reset();regrade();cruise=0;cLbl();say('Restarted')}
applyV();
let laneT=.67,sunL,PIPE=[],burn=false,pT=0,rs=0,oy=0,op=.22,od=8.5,dg=0,lx=0,ly=0,SS,SG;const FX=[];
function mkFx(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,2,32,32,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);const tx=new THREE.CanvasTexture(c);for(let i=0;i<170;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false}));s.visible=false;s.life=0;sc3.add(s);FX.push(s)}}
function spawn(p,k){const s=FX.find(q=>!q.visible);if(!s)return;s.visible=true;s.k=k;s.life=s.max=k?.14:1.4;s.position.copy(p);s.vel=new THREE.Vector3((Math.random()-.5)*1.2,.8+Math.random(),(Math.random()-.5)*1.2);s.material.color.setHex(k?0xffa030:0xdddddd);s.material.blending=k?THREE.AdditiveBlending:THREE.NormalBlending;s.material.needsUpdate=true;s.scale.setScalar(k?.5:.8)}
function fxStep(dt){for(const s of FX){if(!s.visible)continue;s.life-=dt;if(s.life<=0){s.visible=false;continue}const u=s.life/s.max;if(s.k){s.material.opacity=u;s.scale.setScalar(.25+.5*u)}else{s.position.addScaledVector(s.vel,dt);s.material.opacity=.55*u;s.scale.setScalar(.8+(1-u)*3.2)}}}
function autoSteer(){const sg=v<0?-1:1,ff=Math.abs(v)>1?curveAt(pos+8)*v*12.86:0;return clamp(ff+(laneT-px)*1.6*sg,-1,1)*Math.min(1,Math.abs(v)/3)}
function lane(d){const i=clamp(Math.round(laneT/.67)+d,-1,1);laneT=i*.67;say(['Left lane','Center lane','Right lane'][i+1])}
cv.addEventListener('pointerdown',e=>{dg=1;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dg)return;oy+=(e.clientX-lx)*.008;op=clamp(op+(e.clientY-ly)*.006,-.1,1.3);lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>dg=0);cv.addEventListener('pointercancel',()=>dg=0);
cv.addEventListener('wheel',e=>{od=clamp(od+e.deltaY*.01,3.5,22);e.preventDefault()},{passive:false});
cv.addEventListener('dblclick',()=>{oy=0;op=.22;od=8.5});
try{init3d();mkFx();ok=true}catch(err){$('#msg').textContent='3D could not start: '+err.message;msgT=Infinity}
reset();say('Drag to orbit camera · wheel to zoom · A/D change lane');let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;frame(dt,t);requestAnimationFrame(loop)})(last);
