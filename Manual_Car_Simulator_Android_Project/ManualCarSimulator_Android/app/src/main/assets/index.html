<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual Car Simulator</title>
<style>
:root{--bg:#14181b;--pn:#1d2226;--ln:#3a444a;--tx:#e8eef0;--gr:#38e05a;--rd:#ff4d4d;--am:#ffb02e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:600 12px/1.25 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center}
#top button{background:#1d2226cc;border:1.5px solid var(--ln);border-radius:10px;padding:9px 11px}
#top .sp{flex:1}
#top button.on{border-color:var(--am);color:var(--am)}
#msg{position:absolute;left:8px;right:8px;top:54px;text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
#msg.bad{color:#ff8a8a}
#help{position:absolute;left:8px;right:8px;bottom:4px;text-align:center;font-size:10px;opacity:.75;text-shadow:0 1px 2px #000}
#panel{background:var(--pn);border-top:2px solid var(--ln);padding:10px 12px 12px;display:grid;gap:8px}
.r1{display:grid;grid-template-columns:1fr 1fr 1.7fr 1.2fr;gap:8px;align-items:center}
.steer{height:54px;border:2px solid var(--ln);border-radius:12px;background:#161a1d;color:var(--gr);font-size:30px;line-height:1}
.steer.on{background:#22402b}
#dial{width:100%;aspect-ratio:1;max-height:130px}
#ign{display:flex;flex-direction:column;align-items:center;gap:5px}
#key{width:50px;height:50px;border-radius:50%;background:#101316;border:2px solid var(--ln);position:relative;cursor:pointer;transition:transform .15s}
#key i{position:absolute;left:50%;top:6px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:#e8eef0}
#ign.on #key{transform:rotate(90deg);border-color:var(--gr)}
#st{border:2px solid var(--ln);border-radius:8px;padding:5px 12px;background:#161a1d}
#st.on{background:#4a3a12;border-color:var(--am)}
.r2{display:grid;grid-template-columns:1fr 1.9fr 1fr 1fr;gap:8px;height:158px}
.ped{position:relative;border:2px solid var(--ln);border-radius:12px;background:#161a1d;overflow:hidden;touch-action:none}
.ped .f{position:absolute;left:0;right:0;bottom:0;height:0;background:#8ea0aa55}
.ped.b{border-color:#7a3030}.ped.b .f{background:#ff4d4d55}
.ped.g{border-color:#2f7a40}.ped.g .f{background:#38e05a55}
.ped b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.12em;font-size:12px;pointer-events:none}
#shift{position:relative;border:2px solid var(--ln);border-radius:12px;background:#161a1d}
#shift svg{position:absolute;inset:0;width:100%;height:100%}
#shift button{position:absolute;width:30%;height:30%;transform:translate(-50%,-50%);background:none;border:0;padding:0}
#shift .lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;opacity:.8;pointer-events:none}

#panel{background:linear-gradient(180deg,#252d35,#171c21)}
#top button{color:#fff;font-weight:700;text-shadow:0 1px 2px #0008;box-shadow:0 3px 8px #0006}
#top button.on{box-shadow:0 0 0 2px #fff,0 0 14px #fff8;filter:brightness(1.2)}
#bReset{background:linear-gradient(135deg,#e5484d,#a31d2b)!important;border-color:#ff8a8a!important}
#bHand{background:linear-gradient(135deg,#ff9f1c,#d9480f)!important;border-color:#ffd08a!important}
#bSlope{background:linear-gradient(135deg,#a855f7,#6d28d9)!important;border-color:#d8b4fe!important}
#bView{background:linear-gradient(135deg,#38bdf8,#2563eb)!important;border-color:#bae6fd!important}
#bSnd{background:linear-gradient(135deg,#34d399,#059669)!important;border-color:#a7f3d0!important}
.steer{background:linear-gradient(180deg,#1f6b3a,#0f3a20)!important;color:#eaffef!important;border-color:#38e05a!important}
.steer.on{background:linear-gradient(180deg,#38e05a,#1a8f3a)!important;color:#04210e!important}
#st{background:linear-gradient(180deg,#ffb02e,#d97706);color:#2a1700;border-color:#ffd37a}
#st.on{background:linear-gradient(180deg,#fff27a,#ffb02e);box-shadow:0 0 14px #ffb02e}
#pc{border-color:#4aa3ff}#pc .f{background:linear-gradient(0deg,#2563ebcc,#38bdf8aa)}
.ped.b .f{background:linear-gradient(0deg,#c81e2bcc,#ff6b6baa)}.ped.g .f{background:linear-gradient(0deg,#16a34acc,#7cff9aaa)}

#knob{border-color:#7cff9a;background:radial-gradient(circle at 35% 30%,#7cff9a,#16a34a);box-shadow:0 0 10px #38e05a}
#toasts{position:absolute;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#101316ee;border:1.5px solid #38e05a;padding:7px 14px;border-radius:20px;font-size:13px;animation:tin .2s}
.toast.bad{border-color:#ff4d4d;color:#ffb0b0}.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

</div>
