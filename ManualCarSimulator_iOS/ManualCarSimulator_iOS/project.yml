name: ManualCarSimulator
options:
  bundleIdPrefix: com.manualcarsimulator
  deploymentTarget:
    iOS: "15.0"
targets:
  ManualCarSimulator:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manualcarsimulator.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Manual Car Simulator
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
